[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comm-sci-control-app"
version = "20.0.3"
description = "Deterministic Python runtime (UI, state machine, audit/logging) for Comm-SCI governance workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Volker Fickert"}]

dependencies = [
  "pywebview>=5.0",
  "requests>=2.31",
  "markdown>=3.5",
  "bleach>=6.1",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Provider / features
gemini = ["google-genai>=0.6"]
crypto = ["cryptography>=42.0"]

# Dev / quality
dev = ["pytest>=8.0"]

# Convenience bundles
all = [
  "google-genai>=0.6",
  "cryptography>=42.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py"]
testpaths = ["tests"]
